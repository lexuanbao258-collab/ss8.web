# =========================
# PostgreSQL database
# =========================
# Có thể sửa trực tiếp username/password bên dưới.
# Hoặc đặt biến môi trường: DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:25082006}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate tự tạo hoặc cập nhật bảng books và borrows.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Giới hạn kích thước ảnh tải lên.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
